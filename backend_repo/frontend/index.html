<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare AI District Manager Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [facility, setFacility] = useState("PHC_01");
            const [inventory, setInventory] = useState(null);
            const [footfall, setFootfall] = useState(null);
            const [prediction, setPrediction] = useState(null);
            const [loading, setLoading] = useState(false);

            const API_URL = "http://localhost:8000";

            const fetchData = async () => {
                setLoading(true);
                try {
                    // Fetch Inventory
                    const invRes = await fetch(`${API_URL}/api/e-aushadhi/inventory-report?facility_id=${facility}`);
                    const invData = await invRes.json();
                    
                    // The FHIR response structure parsing
                    if(invData.inventoryListing && invData.inventoryListing.length > 0) {
                         const list = invData.inventoryListing.map(lst => lst.items[0]);
                         setInventory(list);
                    } else {
                         setInventory([]);
                    }

                    // Fetch HMIS Footfall
                    const hmisRes = await fetch(`${API_URL}/api/e-sushrut/hmis?facility_id=${facility}`);
                    const hmisData = await hmisRes.json();
                    setFootfall(hmisData);

                    // Fetch EWS Prediction
                    const predRes = await fetch(`${API_URL}/api/ews/predictions?facility_id=${facility}`);
                    const predData = await predRes.json();
                    setPrediction(predData.prediction);

                } catch (error) {
                    console.error("Error fetching data:", error);
                }
                setLoading(false);
            };

            useEffect(() => {
                fetchData();
            }, [facility]);

            return (
                <div className="container mx-auto p-6">
                    <header className="flex justify-between items-center mb-8 bg-blue-900 text-white p-4 rounded-lg shadow-md">
                        <h1 className="text-2xl font-bold">District Manager Control Dashboard (AI Digital Twin)</h1>
                        <div className="flex items-center space-x-4">
                            <label className="font-semibold">Select Facility:</label>
                            <select 
                                className="text-black p-2 rounded" 
                                value={facility} 
                                onChange={(e) => setFacility(e.target.value)}
                            >
                                <option value="PHC_01">PHC 01 (Hilly)</option>
                                <option value="PHC_02">PHC 02 (Plain)</option>
                                <option value="CHC_01">CHC 01 (Large)</option>
                            </select>
                            <button onClick={fetchData} className="bg-blue-600 hover:bg-blue-500 p-2 rounded text-white shadow">
                                Refresh Data
                            </button>
                        </div>
                    </header>

                    {loading ? (
                        <div className="flex justify-center items-center h-64 text-xl text-gray-500 font-semibold animate-pulse">
                            Syncing with Federated Cloud & APIs...
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            
                            {/* Early Warning System Card */}
                            <div className="bg-white p-6 rounded-lg shadow-lg border-t-4 border-red-500">
                                <h2 className="text-xl font-bold text-gray-800 mb-4 flex items-center">
                                    <span className="mr-2">🚨</span> TFT Early Warning System
                                </h2>
                                {prediction ? (
                                    <div>
                                        <p className="text-sm text-gray-500 mb-2">14-Day Horizon Forecast</p>
                                        <div className={`p-4 rounded-lg mb-4 text-white font-bold ${prediction.status === 'CRITICAL' ? 'bg-red-600' : 'bg-green-600'}`}>
                                            Status: {prediction.status}
                                        </div>
                                        <p><strong>Critical Item:</strong> {prediction.critical_item}</p>
                                        <p><strong>Days to Depletion:</strong> <span className="text-red-600 font-bold text-lg">{prediction.estimated_depletion_days}</span></p>
                                        <p><strong>Model Confidence:</strong> {prediction.confidence_interval_percent}%</p>
                                    </div>
                                ) : (
                                    <p className="text-gray-500">No predictions available.</p>
                                )}
                            </div>

                            {/* HMIS Footfall Card */}
                            <div className="bg-white p-6 rounded-lg shadow-lg border-t-4 border-blue-500">
                                <h2 className="text-xl font-bold text-gray-800 mb-4 flex items-center">
                                    <span className="mr-2">👥</span> HMIS Footfall (Last 10 Records)
                                </h2>
                                {footfall && footfall.length > 0 ? (
                                    <ul className="divide-y divide-gray-200">
                                        {footfall.map((obs, idx) => (
                                            <li key={idx} className="py-2 flex justify-between">
                                                <span className="text-gray-600">{new Date(obs.effectiveDateTime).toLocaleDateString()}</span>
                                                <span className="font-bold">{obs.valueInteger} Patients</span>
                                            </li>
                                        ))}
                                    </ul>
                                ) : (
                                    <p className="text-gray-500">No footfall data found.</p>
                                )}
                            </div>

                            {/* Inventory Card */}
                            <div className="bg-white p-6 rounded-lg shadow-lg border-t-4 border-yellow-500">
                                <h2 className="text-xl font-bold text-gray-800 mb-4 flex items-center">
                                    <span className="mr-2">📦</span> e-Aushadhi Inventory
                                </h2>
                                {inventory && inventory.length > 0 ? (
                                    <ul className="divide-y divide-gray-200">
                                        {inventory.map((item, idx) => (
                                            <li key={idx} className="py-3">
                                                <p className="font-semibold text-gray-800">{item.item.display}</p>
                                                <div className="flex justify-between text-sm text-gray-600 mt-1">
                                                    <span>Ref: {item.item.reference}</span>
                                                    <span className="font-bold bg-yellow-100 text-yellow-800 px-2 py-1 rounded">Qty: {item.quantity.value}</span>
                                                </div>
                                            </li>
                                        ))}
                                    </ul>
                                ) : (
                                    <p className="text-gray-500">No inventory data synced.</p>
                                )}
                            </div>

                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
